<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IoT Sensors Dashboard - Lab 3</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .controls {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .controls h2 {
            margin-bottom: 15px;
            color: #333;
        }

        .control-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        .control-group label {
            font-weight: 600;
            color: #555;
        }

        .control-group select, .control-group button {
            padding: 10px 20px;
            border: 2px solid #667eea;
            border-radius: 5px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .control-group select {
            background: white;
        }

        .control-group button {
            background: #667eea;
            color: white;
            font-weight: 600;
        }

        .control-group button:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
            transition: transform 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        }

        .stat-card h3 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 1em;
        }

        .stat-card .value {
            font-size: 2.5em;
            font-weight: bold;
            color: #333;
        }

        .stat-card .label {
            color: #888;
            font-size: 0.9em;
            margin-top: 5px;
        }

        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .chart-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .chart-card h3 {
            margin-bottom: 15px;
            color: #333;
            text-align: center;
        }

        .chart-container {
            position: relative;
            height: 300px;
        }

        .sensor-details {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .sensor-details h2 {
            margin-bottom: 20px;
            color: #333;
        }

        .sensor-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 15px;
        }

        .sensor-item {
            border: 2px solid #f0f0f0;
            padding: 15px;
            border-radius: 8px;
            transition: border-color 0.3s;
        }

        .sensor-item:hover {
            border-color: #667eea;
        }

        .sensor-item h4 {
            color: #667eea;
            margin-bottom: 10px;
        }

        .sensor-item .info {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .sensor-item .info-item {
            font-size: 0.9em;
        }

        .sensor-item .info-item strong {
            color: #333;
        }

        .sensor-item .info-item span {
            color: #666;
        }

        .loading {
            text-align: center;
            color: white;
            font-size: 1.5em;
            padding: 50px;
        }

        .error {
            background: #ff6b6b;
            color: white;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            text-align: center;
        }

        @media (max-width: 768px) {
            .charts-grid {
                grid-template-columns: 1fr;
            }

            .sensor-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 IoT Sensors Dashboard</h1>

        <div class="controls">
            <h2>Налаштування</h2>
            <div class="control-group">
                <label>Період:</label>
                <select id="timePeriod">
                    <option value="1h">Остання година</option>
                    <option value="24h" selected>Останні 24 години</option>
                    <option value="7d">Останній тиждень</option>
                    <option value="30d">Останній місяць</option>
                    <option value="all">Весь час</option>
                </select>

                <label>Тип датчика:</label>
                <select id="sensorType">
                    <option value="">Всі типи</option>
                    <option value="temperature">Температура</option>
                    <option value="humidity">Вологість</option>
                    <option value="light">Освітлення</option>
                </select>

                <button onclick="loadData()">🔄 Оновити дані</button>
                <button onclick="autoRefresh()">⚡ Авто-оновлення (30с)</button>
            </div>
        </div>

        <div id="error" class="error" style="display: none;"></div>
        <div id="loading" class="loading" style="display: none;">Завантаження даних...</div>

        <div id="statsGrid" class="stats-grid"></div>
        <div id="chartsGrid" class="charts-grid"></div>
        <div id="sensorDetails" class="sensor-details" style="display: none;"></div>
    </div>

    <script>
        const API_BASE_URL = 'https://iot-lab3-functions-fpdsa9hraddjbuck.westeurope-01.azurewebsites.net/api';
        let autoRefreshInterval = null;
        let charts = {};

        async function loadData() {
            const timePeriod = document.getElementById('timePeriod').value;
            const sensorType = document.getElementById('sensorType').value;
            
            showLoading(true);
            hideError();

            try {
                // Отримуємо статистику
                let url = `${API_BASE_URL}/get_sensor_stats?time_period=${timePeriod}`;
                if (sensorType) {
                    url += `&sensor_type=${sensorType}`;
                }

                const response = await fetch(url);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const data = await response.json();

                renderStats(data);
                renderCharts(data);
                renderSensorDetails(data);
            } catch (error) {
                showError(`Помилка завантаження даних: ${error.message}`);
            } finally {
                showLoading(false);
            }
        }

        function renderStats(data) {
            const statsGrid = document.getElementById('statsGrid');
            const summary = data.summary;

            statsGrid.innerHTML = `
                <div class="stat-card">
                    <h3>📝 Всього записів</h3>
                    <div class="value">${summary.total_readings.toLocaleString()}</div>
                    <div class="label">за період ${data.time_period}</div>
                </div>
                <div class="stat-card">
                    <h3>📡 Датчиків</h3>
                    <div class="value">${summary.total_sensors}</div>
                    <div class="label">активних датчиків</div>
                </div>
                <div class="stat-card">
                    <h3>📊 Типів датчиків</h3>
                    <div class="value">${summary.total_sensor_types}</div>
                    <div class="label">різних типів</div>
                </div>
            `;
        }

        function renderCharts(data) {
            const chartsGrid = document.getElementById('chartsGrid');
            
            // Групуємо дані по типу датчика
            const sensorTypes = {};
            data.statistics.forEach(stat => {
                if (!sensorTypes[stat.sensor_type]) {
                    sensorTypes[stat.sensor_type] = [];
                }
                sensorTypes[stat.sensor_type].push(stat);
            });

            chartsGrid.innerHTML = '';

            // Графік середніх значень по датчикам
            const avgChartCard = document.createElement('div');
            avgChartCard.className = 'chart-card';
            avgChartCard.innerHTML = '<h3>Середні значення по датчикам</h3><div class="chart-container"><canvas id="avgChart"></canvas></div>';
            chartsGrid.appendChild(avgChartCard);

            // Графік мін/макс значень
            const minMaxChartCard = document.createElement('div');
            minMaxChartCard.className = 'chart-card';
            minMaxChartCard.innerHTML = '<h3>Мінімальні та максимальні значення</h3><div class="chart-container"><canvas id="minMaxChart"></canvas></div>';
            chartsGrid.appendChild(minMaxChartCard);

            // Графік кількості записів
            const countChartCard = document.createElement('div');
            countChartCard.className = 'chart-card';
            countChartCard.innerHTML = '<h3>Кількість записів по датчикам</h3><div class="chart-container"><canvas id="countChart"></canvas></div>';
            chartsGrid.appendChild(countChartCard);

            // Очищуємо старі графіки
            Object.values(charts).forEach(chart => chart.destroy());
            charts = {};

            // Малюємо графіки
            setTimeout(() => {
                drawAvgChart(data.statistics);
                drawMinMaxChart(data.statistics);
                drawCountChart(data.statistics);
            }, 100);
        }

        function drawAvgChart(statistics) {
            const ctx = document.getElementById('avgChart').getContext('2d');
            charts.avgChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: statistics.map(s => s.sensor_id),
                    datasets: [{
                        label: 'Середнє значення',
                        data: statistics.map(s => s.avg_value),
                        backgroundColor: statistics.map((s, i) => {
                            const colors = ['rgba(102, 126, 234, 0.7)', 'rgba(118, 75, 162, 0.7)', 'rgba(237, 100, 166, 0.7)'];
                            return colors[i % colors.length];
                        }),
                        borderColor: statistics.map((s, i) => {
                            const colors = ['rgba(102, 126, 234, 1)', 'rgba(118, 75, 162, 1)', 'rgba(237, 100, 166, 1)'];
                            return colors[i % colors.length];
                        }),
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        y: { beginAtZero: true }
                    }
                }
            });
        }

        function drawMinMaxChart(statistics) {
            const ctx = document.getElementById('minMaxChart').getContext('2d');
            charts.minMaxChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: statistics.map(s => s.sensor_id),
                    datasets: [
                        {
                            label: 'Максимум',
                            data: statistics.map(s => s.max_value),
                            borderColor: 'rgba(255, 99, 132, 1)',
                            backgroundColor: 'rgba(255, 99, 132, 0.2)',
                            tension: 0.4
                        },
                        {
                            label: 'Мінімум',
                            data: statistics.map(s => s.min_value),
                            borderColor: 'rgba(54, 162, 235, 1)',
                            backgroundColor: 'rgba(54, 162, 235, 0.2)',
                            tension: 0.4
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: true }
                    }
                }
            });
        }

        function drawCountChart(statistics) {
            const ctx = document.getElementById('countChart').getContext('2d');
            charts.countChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: statistics.map(s => s.sensor_id),
                    datasets: [{
                        data: statistics.map(s => s.count),
                        backgroundColor: [
                            'rgba(102, 126, 234, 0.7)',
                            'rgba(118, 75, 162, 0.7)',
                            'rgba(237, 100, 166, 0.7)',
                            'rgba(255, 193, 7, 0.7)',
                            'rgba(76, 175, 80, 0.7)'
                        ]
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom'
                        }
                    }
                }
            });
        }

        function renderSensorDetails(data) {
            const container = document.getElementById('sensorDetails');
            container.style.display = 'block';

            let html = '<h2>Детальна інформація по датчикам</h2><div class="sensor-grid">';

            data.statistics.forEach(sensor => {
                const icons = {
                    'temperature': '🌡️',
                    'humidity': '💧',
                    'light': '💡'
                };
                const icon = icons[sensor.sensor_type] || '📡';

                html += `
                    <div class="sensor-item">
                        <h4>${icon} ${sensor.sensor_id}</h4>
                        <div class="info">
                            <div class="info-item"><strong>Тип:</strong> <span>${sensor.sensor_type}</span></div>
                            <div class="info-item"><strong>Записів:</strong> <span>${sensor.count.toLocaleString()}</span></div>
                            <div class="info-item"><strong>Середнє:</strong> <span>${sensor.avg_value}</span></div>
                            <div class="info-item"><strong>Мін:</strong> <span>${sensor.min_value}</span></div>
                            <div class="info-item"><strong>Макс:</strong> <span>${sensor.max_value}</span></div>
                            <div class="info-item"><strong>Останнє вимірювання:</strong> <span>${new Date(sensor.last_reading).toLocaleString('uk-UA')}</span></div>
                        </div>
                    </div>
                `;
            });

            html += '</div>';
            container.innerHTML = html;
        }

        function showLoading(show) {
            document.getElementById('loading').style.display = show ? 'block' : 'none';
        }

        function showError(message) {
            const errorDiv = document.getElementById('error');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }

        function hideError() {
            document.getElementById('error').style.display = 'none';
        }

        function autoRefresh() {
            if (autoRefreshInterval) {
                clearInterval(autoRefreshInterval);
                autoRefreshInterval = null;
                alert('Авто-оновлення вимкнено');
            } else {
                autoRefreshInterval = setInterval(loadData, 30000);
                alert('Авто-оновлення увімкнено (кожні 30 секунд)');
                loadData();
            }
        }

        // Завантажуємо дані при завантаженні сторінки
        window.addEventListener('load', loadData);
    </script>
</body>
</html>
